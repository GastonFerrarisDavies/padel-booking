# Dos Ingress separados: las anotaciones aplican a TODO el recurso, y el
# rewrite de la API no debe tocar las rutas del frontend (/_next/static, /login...).

# 1. API: /api/<recurso>... -> <servicio>/<recurso>... (se quita solo el prefijo /api)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: padel-api-ingress
  namespace: padel-dev
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # User Microservice (Node) — /users, /auth
      - path: /api/((?:users|auth).*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-service
            port:
              number: 80

      # Court Microservice (Go)
      - path: /api/(courts.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: court-service
            port:
              number: 80

      # Booking Microservice (Go)
      - path: /api/(bookings.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: booking-service
            port:
              number: 80

---
# 2. FRONTEND (export estático servido por nginx): sin rewrite.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: padel-web-ingress
  namespace: padel-dev
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
