apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: padel-dev
type: Opaque
stringData: # Change these values in your local environment before applying to the cluster
# In a real production environment, you should use a more secure method to manage secrets, such as Azure Key Vault, AWS Secrets Manager, or HashiCorp Vault.
  USER_DB_PASSWORD: "changeme123"
  COURT_DB_PASSWORD: "changeme123"
  BOOKING_DB_PASSWORD: "changeme123"
---
# Claves de Clerk para user-service (https://dashboard.clerk.com → API keys).
# NO commitear claves reales: reemplazar localmente o crear el secret con
#   kubectl -n padel-dev create secret generic clerk-credentials --from-literal=CLERK_SECRET_KEY=sk_... ...
apiVersion: v1
kind: Secret
metadata:
  name: clerk-credentials
  namespace: padel-dev
type: Opaque
stringData:
  CLERK_SECRET_KEY: "sk_test_changeme"
  CLERK_PUBLISHABLE_KEY: "pk_test_changeme"
  # Orígenes del frontend aceptados como `azp` del token (separados por coma).
  CLERK_AUTHORIZED_PARTIES: ""
  # La cuenta de Clerk con este email (verificado) pasa a OWNER en su primer ingreso.
  OWNER_EMAIL: "admin@padel.com"
