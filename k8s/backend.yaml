apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: padel-dev
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: padel-dev
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: tawanchai/padel-user-service:f9c0bf0
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: user-db
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: user_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: USER_DB_PASSWORD
            - name: DB_DATABASE
              value: user_service_db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              value: 3600s
            # Cuenta OWNER inicial (opcional): solo se crea si todavía no hay un OWNER.
            - name: OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: OWNER_EMAIL
                  optional: true
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: OWNER_PASSWORD
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

