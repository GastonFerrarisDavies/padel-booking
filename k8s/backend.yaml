apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: padel-dev
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: padel-dev
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: tawanchai/padel-user-service:acd7313
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: user-db
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: user_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: USER_DB_PASSWORD
            - name: DB_DATABASE
              value: user_service_db
            # Clerk: autenticación. Los roles viven en la tabla user_roles de este servicio.
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clerk-credentials
                  key: CLERK_SECRET_KEY
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: clerk-credentials
                  key: CLERK_PUBLISHABLE_KEY
            - name: CLERK_AUTHORIZED_PARTIES
              valueFrom:
                secretKeyRef:
                  name: clerk-credentials
                  key: CLERK_AUTHORIZED_PARTIES
                  optional: true
            # OWNER inicial (opcional): la cuenta de Clerk con este email verificado pasa a OWNER
            # en su primer ingreso, si todavía no hay un OWNER.
            - name: OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: clerk-credentials
                  key: OWNER_EMAIL
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: court-service
  namespace: padel-dev
  labels:
    app: court-service
spec:
  type: ClusterIP
  selector:
    app: court-service
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: court-service
  namespace: padel-dev
  labels:
    app: court-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: court-service
  template:
    metadata:
      labels:
        app: court-service
    spec:
      containers:
        - name: court-service
          image: tawanchai/padel-court-service:acd7313
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: court-db
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: court_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: COURT_DB_PASSWORD
            - name: DB_NAME
              value: court_service_db
            # Autoriza las rutas protegidas vía GET /auth/me de user-service.
            - name: USER_SERVICE_URL
              value: http://user-service
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

