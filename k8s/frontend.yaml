apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: padel-frontend
spec:
  type: ClusterIP
  selector:
    app: padel-frontend
  ports:
    - protocol: TCP
      port: 80 
      targetPort: 80

---
# 2. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: padel-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: padel-frontend
  template:
    metadata:
      labels:
        app: padel-frontend
    spec:
      containers:
        - name: frontend-app
          image: padel-frontend:latest
          
          # Minikube: Local image download.
          imagePullPolicy: Never 
          
          ports:
            - containerPort: 80
          
          # Resource requests and limits
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"