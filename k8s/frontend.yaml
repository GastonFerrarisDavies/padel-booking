apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: padel-dev
  labels:
    app: padel-frontend
spec:
  type: ClusterIP
  selector:
    app: padel-frontend
  ports:
    - protocol: TCP
      port: 80 
      targetPort: 80

---
# 2. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: padel-dev
  name: frontend-deployment
  labels:
    app: padel-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: padel-frontend
  template:
    metadata:
      labels:
        app: padel-frontend
    spec:
      containers:
        - name: frontend-app
          # El tag lo actualiza el workflow de CI (.github/workflows/ci.yml).
          image: tawanchai/padel-frontend:7d902a2

          ports:
            - containerPort: 80
          
          # Resource requests and limits
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"