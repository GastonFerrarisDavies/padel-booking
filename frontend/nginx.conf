server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Export estático de Next: /login -> login.html, /dashboard/courts -> dashboard/courts.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Assets con hash de contenido: cache larga.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
